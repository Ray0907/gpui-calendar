[package]
name = "gpui-calendar"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gpui-kit = "0.8.1"

[dev-dependencies]
gpui-kit = { version = "0.8.1", features = ["test-support"] }

[[test]]
name = "screenshot"
harness = false
